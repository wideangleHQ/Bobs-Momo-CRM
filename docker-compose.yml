services:
  postgres:
    image: postgres:15-alpine
    container_name: bobs-momo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: bobsmomo
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: bobsmomo
      TZ: Asia/Kolkata
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobsmomo -d bobsmomo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bobs-momo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
